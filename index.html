<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roscoe Holdings Group, Inc.</title>
  <meta name="description" content="Roscoe Holdings Group, Inc. Cleveland, Ohio.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23d6281f'/%3E%3C/svg%3E">
  <style>
    :root {
      --paper: oklch(98.2% 0.004 85);
      --ink: oklch(17% 0.008 260);
      --red: oklch(57% 0.2 29);
      --edge: clamp(1.25rem, 4vw, 4rem);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: 1fr auto;
      background: var(--paper);
      color: var(--ink);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-weight: 700;
      -webkit-font-smoothing: antialiased;
    }

    main {
      align-self: center;
      padding: var(--edge);
    }

    h1 {
      margin: 0;
      max-width: 12ch;
      font-size: clamp(3rem, 1rem + 8vw, 9rem);
      line-height: 0.92;
      letter-spacing: -0.055em;
    }

    h1::before {
      content: "";
      display: block;
      width: 0.28em;
      height: 0.28em;
      margin-bottom: 0.4em;
      background: var(--red);
    }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      margin: 0 var(--edge);
      padding: 1rem 0 1.5rem;
      border-top: 3px solid var(--ink);
      font-size: 0.875rem;
    }

    footer p {
      margin: 0;
    }
  </style>
</head>
<body>
  <main>
    <h1>Roscoe Holdings Group, Inc.</h1>
  </main>
  <footer>
    <p>© 2026 Roscoe Holdings Group, Inc.</p>
    <p>Cleveland, Ohio</p>
  </footer>
</body>
</html>
