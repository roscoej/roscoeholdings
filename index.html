<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roscoe Holdings Group, Inc.</title>
  <meta name="description" content="Roscoe Holdings Group, Inc.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23d6281f'/%3E%3C/svg%3E">
  <style>
    :root {
      --paper: oklch(98.4% 0.003 85);
      --ink: oklch(14% 0.004 260);
      --red: oklch(56% 0.215 29);
      --edge: clamp(1.25rem, 4.5vw, 4.5rem);
      --gap: clamp(1rem, 2vw, 2rem);
      --heavy: clamp(8px, 1vw, 16px);
      --display: min(11.4vw, 12rem);
      --text: clamp(0.875rem, 0.84rem + 0.18vw, 1rem);
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: var(--edge);
      background: var(--paper);
      color: var(--ink);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: var(--text);
      line-height: 1.35;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      column-gap: var(--gap);
    }

    .masthead {
      border-top: var(--heavy) solid var(--ink);
      padding-top: clamp(0.5rem, 1.2vw, 1.25rem);
    }

    .masthead h1 {
      grid-column: 1 / -1;
      margin: 0;
      font-size: var(--display);
      font-weight: 700;
      line-height: 0.86;
      letter-spacing: -0.055em;
    }

    .masthead h1 span {
      display: block;
    }

    .info {
      align-content: end;
      padding-top: clamp(3rem, 8vw, 7rem);
    }

    .mark {
      grid-column: 12 / -1;
      align-self: end;
      justify-self: end;
      width: clamp(1.25rem, 2.2vw, 2.25rem);
      aspect-ratio: 1;
      background: var(--red);
      pointer-events: none;
      will-change: transform;
    }

    .mark.is-paused {
      animation: blink 1.06s steps(1, end) infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .mark {
        animation: none;
      }
    }

    .base {
      margin-top: clamp(2rem, 4vw, 3.5rem);
      padding-top: 0.55rem;
      border-top: var(--heavy) solid var(--ink);
    }

    .base p {
      grid-column: 1 / -1;
      margin: 0;
    }

    @media (max-width: 48rem) {
      :root {
        --display: 15.5vw;
      }
    }
  </style>
</head>
<body>
  <header class="masthead grid">
    <h1>
      <span>Roscoe Holdings</span>
      <span>Group, Inc.</span>
    </h1>
  </header>

  <main class="info grid">
    <span class="mark" aria-hidden="true"></span>
  </main>

  <footer class="base grid">
    <p>© 2026</p>
  </footer>

  <script>
    const mark = document.querySelector('.mark');
    const court = document.querySelector('.masthead');
    const baseline = document.querySelector('.base');
    const PADDLE = 14;
    const MAX_FRAME_MS = 32;

    let home = null;
    let bounds = null;
    let x = 0;
    let y = 0;
    let vx = 0;
    let vy = 0;
    let paused = false;
    let pointer = null;
    let lastTime = null;

    function measure() {
      const previous = mark.style.transform;
      mark.style.transform = 'none';
      home = mark.getBoundingClientRect();
      mark.style.transform = previous;

      const area = court.getBoundingClientRect();
      const ruleWidth = parseFloat(getComputedStyle(court).borderTopWidth) || 0;
      bounds = {
        left: area.left,
        right: area.right - home.width,
        top: area.top + ruleWidth,
        bottom: baseline.getBoundingClientRect().top - home.height,
      };
    }

    function speed() {
      return Math.min(0.5, Math.max(0.18, (bounds.right - bounds.left) / 2800));
    }

    function clampPosition() {
      x = Math.min(bounds.right, Math.max(bounds.left, x));
      y = Math.min(bounds.bottom, Math.max(bounds.top, y));
    }

    function bounceOffWalls() {
      if (x <= bounds.left) { x = bounds.left; vx = Math.abs(vx); }
      if (x >= bounds.right) { x = bounds.right; vx = -Math.abs(vx); }
      if (y <= bounds.top) { y = bounds.top; vy = Math.abs(vy); }
      if (y >= bounds.bottom) { y = bounds.bottom; vy = -Math.abs(vy); }
    }

    function bounceOffPointer() {
      if (!pointer) return;
      const size = home.width;
      const inside =
        pointer.x >= x - PADDLE && pointer.x <= x + size + PADDLE &&
        pointer.y >= y - PADDLE && pointer.y <= y + size + PADDLE;
      if (!inside) return;

      const dx = x + size / 2 - pointer.x;
      const dy = y + size / 2 - pointer.y;
      if (Math.abs(dx) > Math.abs(dy)) {
        vx = Math.sign(dx || 1) * Math.abs(vx);
      } else {
        vy = Math.sign(dy || 1) * Math.abs(vy);
      }
    }

    function render() {
      mark.style.transform = `translate(${x - home.left}px, ${y - home.top}px)`;
    }

    function tick(time) {
      const dt = lastTime === null ? 0 : Math.min(MAX_FRAME_MS, time - lastTime);
      lastTime = time;

      if (!paused) {
        x += vx * dt;
        y += vy * dt;
        bounceOffWalls();
        bounceOffPointer();
        render();
      }

      requestAnimationFrame(tick);
    }

    function handlePointerMove(event) {
      pointer = { x: event.clientX, y: event.clientY };
    }

    function handlePointerLeave() {
      pointer = null;
    }

    function handlePointerDown() {
      paused = !paused;
      mark.classList.toggle('is-paused', paused);
    }

    function handleResize() {
      measure();
      const s = speed();
      vx = Math.sign(vx) * s * 0.8;
      vy = Math.sign(vy) * s * 0.6;
      clampPosition();
      render();
    }

    measure();
    x = home.left;
    y = home.top;
    vx = -speed() * 0.8;
    vy = -speed() * 0.6;

    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      window.addEventListener('resize', handleResize);
      document.addEventListener('pointermove', handlePointerMove);
      document.addEventListener('pointerdown', handlePointerDown);
      document.documentElement.addEventListener('pointerleave', handlePointerLeave);
      requestAnimationFrame(tick);
    }
  </script>
</body>
</html>
