<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thanks for setting up your ACH</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      color: #000;
    }
    main {
      padding: 1.5rem;
      text-align: center;
      font-family: Helvetica, Arial, sans-serif;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 700;
    }
    p {
      margin: 1rem 0 0;
      font-size: clamp(1.25rem, 3vw, 1.75rem);
      font-weight: 700;
    }
    #timer {
      margin-top: 1.5rem;
      font-size: 1.25rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Thanks for setting up your ACH.</h1>
    <p>You may now close this window.</p>
    <p id="timer">5</p>
  </main>
  <script>
    var seconds = 5;
    var timer = document.getElementById("timer");
    var countdown = setInterval(function () {
      seconds -= 1;
      if (seconds > 0) {
        timer.textContent = String(seconds);
        return;
      }
      clearInterval(countdown);
      timer.textContent = "0";
      window.close();
    }, 1000);
  </script>
</body>
</html>
